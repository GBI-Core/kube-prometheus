# Thin caller - all logic lives in GBI-Core/agent-base reusable workflows.
# Auto-fix mode disabled: the review agent comments only, no code changes.
# Workflow bugs? Fix in agent-base, not here.
name: "Claude: PR Review Agent"

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  statuses: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.head.commit.message, '[skip review]')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude-review') && !contains(github.event.comment.body, '@claude-review-fast')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude-review') && !contains(github.event.comment.body, '@claude-review-fast')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude-review') && !contains(github.event.review.body, '@claude-review-fast'))
    uses: GBI-Core/agent-base/.github/workflows/claude-review-reusable.yml@v1
    with:
      auto_fix: false
      opt_in_auto_fix: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '--fix') }}

    secrets: inherit
